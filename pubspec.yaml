name: scry
description: "Offline-first RSS and Atom reader."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.0.7
  cached_network_image: ^4.0.5
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  flutter_local_notifications: ^22.3.2
  html: ^0.15.7
  intl: ^0.20.3
  path: ^1.9.1
  provider: ^6.1.5+1
  rss_dart: ^1.0.14
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.2
  webview_flutter: ^4.14.1
  workmanager: ^0.10.10
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
