publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cached_network_image: ^4.0.5
  dio: ^5.11.1
  flutter:
    sdk: flutter
  html: ^0.15.7
  intl: ^0.20.3
  path: ^1.9.1
